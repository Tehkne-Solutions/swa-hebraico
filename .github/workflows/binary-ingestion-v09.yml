name: ALEPH 119 Binary Ingestion v0.9 Gate

on:
  pull_request:
    paths:
      - 'tools/ingest_asset_batch_v09.ps1'
      - 'tools/ingest_asset_batch_v09.sh'
      - 'docs/BINARY_INGESTION_RUNBOOK_v09.md'
      - '.github/workflows/binary-ingestion-v09.yml'
  push:
    branches: [main]

jobs:
  validate-ingestion-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n tools/ingest_asset_batch_v09.sh
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/ingest_asset_batch_v09.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify canonical batch references
        run: |
          for batch in B00 B01 B02 B03 B04; do
            grep -q "$batch" docs/BINARY_INGESTION_RUNBOOK_v09.md
          done
